<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Find My Buddy — connect with people in Liberia who share your interests, and discover or create activities together." />
  <title>Find My Buddy</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <!-- App root; views are rendered by app.js -->
  <div id="app" aria-live="polite"></div>

  <!-- Toast host -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

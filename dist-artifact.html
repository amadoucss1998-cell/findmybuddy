<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>Find My Buddy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Find My Buddy — Design System
   Mobile-first, installable PWA. Light + dark aware.
   ============================================================ */

:root {
  /* Brand */
  --brand: #4f46e5;
  --brand-600: #4338ca;
  --brand-700: #3730a3;
  --brand-soft: #eef0ff;
  --accent: #f43f5e;
  --accent-soft: #ffe4ea;
  --gold: #f59e0b;
  --gold-soft: #fff3d6;
  --green: #10b981;
  --green-soft: #d6f5ea;

  /* Neutrals (light) */
  --bg: #f5f6fb;
  --surface: #ffffff;
  --surface-2: #f0f2f8;
  --border: #e6e8f0;
  --text: #10121a;
  --text-2: #565b6e;
  --text-3: #8b8fa3;

  --shadow-sm: 0 1px 2px rgba(16, 18, 26, .06), 0 1px 3px rgba(16, 18, 26, .05);
  --shadow-md: 0 6px 20px rgba(16, 18, 26, .10);
  --shadow-lg: 0 18px 50px rgba(16, 18, 26, .16);

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;

  --nav-h: 68px;
  --header-h: 60px;
  --maxw: 620px;

  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

[data-theme="dark"] {
  --bg: #0b0e17;
  --surface: #151a26;
  --surface-2: #1d2333;
  --border: #262d40;
  --text: #f2f4fb;
  --text-2: #a9b0c5;
  --text-3: #6f778f;
  --brand-soft: #1e2240;
  --accent-soft: #3a1c26;
  --gold-soft: #3a2f14;
  --green-soft: #123027;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 8px 24px rgba(0,0,0,.5);
  --shadow-lg: 0 20px 55px rgba(0,0,0,.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 16px; }
a { color: var(--brand); text-decoration: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* ---------- App shell ---------- */
#app { max-width: var(--maxw); margin: 0 auto; min-height: 100%; position: relative; }

.screen {
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
  animation: fade .28s ease;
}
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
  max-width: var(--maxw); margin: 0 auto;
}
.app-header h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.app-header .logo-dot { width: 26px; height: 26px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--accent)); box-shadow: var(--shadow-sm); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  color: var(--text-2); font-size: 18px; transition: transform .12s;
}
.icon-btn:active { transform: scale(.92); }

.subtitle { color: var(--text-2); font-size: 14px; margin-top: 2px; }

/* ---------- Bottom nav ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  max-width: var(--maxw); margin: 0 auto;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(16px);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--border);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-3); font-size: 11px; font-weight: 600; position: relative;
  transition: color .15s;
}
.tab .ic { font-size: 21px; line-height: 1; }
.tab.active { color: var(--brand); }
.tab.active .ic { transform: translateY(-1px); }
.tab .fab-plus {
  width: 46px; height: 46px; margin-top: -18px; border-radius: 16px;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 700;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--brand) 45%, transparent);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 18px; border-radius: 14px; font-weight: 700; font-size: 15px;
  background: var(--surface-2); color: var(--text); transition: transform .12s, filter .15s;
  border: 1px solid transparent;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-600)); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 35%, transparent); }
.btn-accent { background: linear-gradient(135deg, var(--accent), #e11d48); color: #fff; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #d97706); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-block { width: 100%; }
.btn-sm { padding: 9px 14px; font-size: 13px; border-radius: 11px; }
.btn:disabled { opacity: .5; pointer-events: none; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 14px;
}
.card-tap { transition: transform .12s, box-shadow .15s; }
.card-tap:active { transform: scale(.985); }

/* ---------- Avatar ---------- */
.avatar {
  border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff;
  flex: none; user-select: none; background: var(--brand);
}
.avatar.sq { border-radius: 14px; }
.av-40 { width: 40px; height: 40px; font-size: 15px; }
.av-48 { width: 48px; height: 48px; font-size: 17px; }
.av-56 { width: 56px; height: 56px; font-size: 20px; }
.av-88 { width: 88px; height: 88px; font-size: 30px; }

/* ---------- Chips / tags ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--text-2); border: 1px solid transparent;
  transition: all .12s; white-space: nowrap;
}
.chip.selectable:active { transform: scale(.95); }
.chip.on { background: var(--brand-soft); color: var(--brand); border-color: color-mix(in srgb, var(--brand) 35%, transparent); }
.chip.tiny { padding: 4px 10px; font-size: 11.5px; }
.chip.match { background: var(--green-soft); color: var(--green); }

.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Segmented control ---------- */
.segment { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 16px; }
.segment button { flex: 1; padding: 9px; border-radius: 11px; font-weight: 700; font-size: 13.5px; color: var(--text-2); }
.segment button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 7px; }
.input, textarea.input, select.input {
  width: 100%; padding: 13px 14px; border-radius: 13px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text); transition: border .15s, box-shadow .15s;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
textarea.input { resize: vertical; min-height: 92px; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* ---------- Layout helpers ---------- */
.row { display: flex; gap: 12px; align-items: center; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 700; }
.center { text-align: center; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; }
.gap-6 { gap: 6px; } .wrap { flex-wrap: wrap; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-title { font-size: 17px; font-weight: 800; letter-spacing: -.01em; margin: 22px 0 12px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* ---------- Match meter ---------- */
.meter { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), var(--brand)); }

/* ---------- Activity card ---------- */
.activity-cover {
  height: 108px; border-radius: var(--r-md); margin: -16px -16px 14px; display: flex; align-items: flex-end;
  padding: 12px 14px; color: #fff; position: relative; overflow: hidden;
}
.activity-cover .price-pill {
  position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
  padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
}
.activity-cover .emoji { position: absolute; top: 8px; left: 14px; font-size: 40px; opacity: .95; filter: drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
.meta-row { display: flex; flex-wrap: wrap; gap: 12px; color: var(--text-2); font-size: 13px; font-weight: 600; margin: 6px 0; }
.meta-row span { display: inline-flex; align-items: center; gap: 5px; }

.attendees { display: flex; align-items: center; }
.attendees .avatar { border: 2px solid var(--surface); margin-left: -10px; box-shadow: var(--shadow-sm); }
.attendees .avatar:first-child { margin-left: 0; }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 48px 20px; color: var(--text-2); }
.empty .em { font-size: 46px; margin-bottom: 12px; }
.empty h3 { color: var(--text); font-size: 17px; margin-bottom: 6px; }

/* ---------- Banner / premium ---------- */
.premium-banner {
  border-radius: var(--r-lg); padding: 18px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #6d28d9, #db2777 90%);
  box-shadow: var(--shadow-md); margin-bottom: 16px;
}
.premium-banner::after { content: "✦"; position: absolute; right: -6px; top: -18px; font-size: 120px; opacity: .12; }
.premium-banner h3 { font-size: 18px; font-weight: 800; }
.premium-banner p { font-size: 13.5px; opacity: .92; margin: 4px 0 12px; max-width: 78%; }

/* ---------- Modal / sheet ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 15, .55);
  display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease;
  backdrop-filter: blur(2px);
}
.sheet {
  width: 100%; max-width: var(--maxw); background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px);
  box-shadow: var(--shadow-lg); animation: slideup .3s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow-y: auto;
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
.grabber { width: 42px; height: 5px; border-radius: 999px; background: var(--border); margin: 6px auto 14px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px);
  translate: -50% 20px; z-index: 90;
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px;
  font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
  transition: opacity .2s, translate .25s; max-width: 88%;
}
.toast.show { opacity: 1; translate: -50% 0; }

/* ---------- Onboarding ---------- */
.onboard { min-height: 100%; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 22px); }
.onboard-hero { text-align: center; margin: 24px 0; }
.onboard-logo { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 18px; background: linear-gradient(135deg, var(--brand), var(--accent)); display: grid; place-items: center; font-size: 38px; box-shadow: var(--shadow-lg); }
.onboard h1 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
.onboard .lead { color: var(--text-2); font-size: 15px; margin-top: 8px; }
.progress-dots { display: flex; gap: 7px; justify-content: center; margin: 4px 0 20px; }
.progress-dots i { width: 8px; height: 8px; border-radius: 999px; background: var(--border); transition: all .2s; }
.progress-dots i.on { width: 22px; background: var(--brand); }

/* ---------- Messages ---------- */
.thread { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 90px; }
.bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; }
.bubble.them { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: linear-gradient(135deg, var(--brand), var(--brand-600)); color: #fff; border-bottom-right-radius: 6px; }
.msg-time { font-size: 10.5px; color: var(--text-3); margin: 2px 4px; }
.composer {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: var(--maxw); margin: 0 auto;
  display: flex; gap: 8px; padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
  background: var(--surface); border-top: 1px solid var(--border);
}
.composer input { flex: 1; padding: 12px 15px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.composer .send { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-600)); color: #fff; font-size: 20px; display: grid; place-items: center; flex: none; }

/* ---------- Back header ---------- */
.subheader { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
  max-width: var(--maxw); margin: 0 auto; }
.subheader h2 { font-size: 17px; font-weight: 800; }

/* ---------- Stat row ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--r-md); padding: 14px 10px; text-align: center; }
.stat b { font-size: 20px; font-weight: 800; display: block; }
.stat span { font-size: 12px; color: var(--text-2); }

/* ---------- Search ---------- */
.searchbar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.searchbar input { flex: 1; border: none; background: none; color: var(--text); outline: none; }
.searchbar .ic { color: var(--text-3); }

.scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 14px; padding-inline: 16px; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }

.badge-verified { color: var(--brand); font-size: 13px; }
.badge-plus { background: linear-gradient(135deg,var(--gold),#d97706); color:#fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; letter-spacing: .03em; }

</style>
</head>

<script>
/* ============================================================
   Find My Buddy — Store (state + persistence + logic)
   Exposed on window.Store
   ============================================================ */
(function () {
  const KEY = "fmb_state_v1";
  const D = window.FMB_DATA;

  function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 9); }
  function now() { return Date.now(); }

  function futureDate(inDays, hour) {
    const d = new Date();
    d.setDate(d.getDate() + inDays);
    d.setHours(hour, 0, 0, 0);
    return d.getTime();
  }

  function buildSeedActivities() {
    return D.ACTIVITY_SEED.map((a) => ({
      id: uid("act"),
      title: a.title,
      interest: a.interest,
      hostId: a.host,
      county: a.county,
      location: a.location,
      when: futureDate(a.inDays, a.hour),
      capacity: a.cap,
      priceLRD: a.priceLRD,
      desc: a.desc,
      attendees: seedAttendees(a.host, a.interest),
      promoted: a.priceLRD > 800, // pretend paid boosts
      createdAt: now(),
    }));
  }

  // give each seed activity a few plausible attendees
  function seedAttendees(hostId, interest) {
    const pool = D.PEOPLE.filter((p) => p.id !== hostId && p.interests.includes(interest)).map((p) => p.id);
    const others = D.PEOPLE.filter((p) => p.id !== hostId && !p.interests.includes(interest)).map((p) => p.id);
    const picks = [hostId, ...pool.slice(0, 3), ...others.slice(0, 1)];
    return [...new Set(picks)];
  }

  const DEFAULT_STATE = () => ({
    onboarded: false,
    theme: "light",
    me: null, // {id,name,county,bio,interests[],plus:false}
    people: D.PEOPLE.map((p) => ({ ...p, avatarColor: pickColor(p.id) })),
    activities: buildSeedActivities(),
    connections: [],   // person ids I've connected with
    joined: [],        // activity ids I've joined
    threads: {},       // personId -> [{from:'me'|'them', text, at}]
    seenPlus: false,
  });

  function pickColor(seed) {
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return D.AV_COLORS[h % D.AV_COLORS.length];
  }

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return DEFAULT_STATE();
      const parsed = JSON.parse(raw);
      // shallow migration safety
      return Object.assign(DEFAULT_STATE(), parsed);
    } catch (e) {
      return DEFAULT_STATE();
    }
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  const listeners = new Set();
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function emit() { persist(); listeners.forEach((fn) => fn(state)); }

  /* ---------- Selectors ---------- */
  function get() { return state; }
  function me() { return state.me; }
  function personById(id) {
    if (state.me && id === state.me.id) return { ...state.me, avatarColor: pickColor(state.me.id), isMe: true };
    return state.people.find((p) => p.id === id) || { id, name: "Unknown", county: "", interests: [], avatarColor: "#999" };
  }
  function interestById(id) { return D.INTERESTS.find((i) => i.id === id); }
  function activityById(id) { return state.activities.find((a) => a.id === id); }

  // Match score 0..100 between me and a person = shared interests weighted + same county bonus
  function matchScore(person) {
    if (!state.me) return 0;
    const mine = new Set(state.me.interests);
    const shared = person.interests.filter((i) => mine.has(i));
    const denom = Math.max(1, Math.min(mine.size, person.interests.length));
    let score = Math.round((shared.length / denom) * 92);
    if (person.county === state.me.county) score += 8;
    return Math.max(6, Math.min(100, score));
  }
  function sharedInterests(person) {
    if (!state.me) return [];
    const mine = new Set(state.me.interests);
    return person.interests.filter((i) => mine.has(i));
  }

  function suggestedPeople() {
    return state.people
      .map((p) => ({ ...p, _score: matchScore(p), _shared: sharedInterests(p).length }))
      .sort((a, b) => b._score - a._score);
  }

  function activityRelevance(a) {
    if (!state.me) return a.promoted ? 1 : 0;
    const mine = new Set(state.me.interests);
    let s = mine.has(a.interest) ? 60 : 0;
    if (a.county === state.me.county) s += 20;
    if (a.promoted) s += 10;
    // soonness bonus
    const days = (a.when - now()) / 86400000;
    if (days > 0 && days < 4) s += 8;
    return s;
  }

  function upcomingActivities() {
    return state.activities
      .filter((a) => a.when > now() - 3600000)
      .map((a) => ({ ...a, _rel: activityRelevance(a) }))
      .sort((a, b) => b._rel - a._rel || a.when - b.when);
  }

  /* ---------- Mutations ---------- */
  function completeOnboarding(profile) {
    state.me = {
      id: uid("me"),
      name: profile.name.trim(),
      county: profile.county,
      bio: profile.bio.trim(),
      interests: profile.interests,
      plus: false,
      avatarColor: "#4f46e5",
      joinedAt: now(),
    };
    state.onboarded = true;
    emit();
  }

  function updateProfile(patch) {
    if (!state.me) return;
    Object.assign(state.me, patch);
    emit();
  }

  function toggleConnection(personId) {
    const i = state.connections.indexOf(personId);
    if (i >= 0) state.connections.splice(i, 1);
    else state.connections.push(personId);
    emit();
    return state.connections.includes(personId);
  }
  function isConnected(personId) { return state.connections.includes(personId); }

  function toggleJoin(activityId) {
    const a = activityById(activityId);
    if (!a || !state.me) return false;
    const meId = state.me.id;
    const i = state.joined.indexOf(activityId);
    if (i >= 0) {
      state.joined.splice(i, 1);
      a.attendees = a.attendees.filter((x) => x !== meId);
    } else {
      state.joined.push(activityId);
      if (!a.attendees.includes(meId)) a.attendees.push(meId);
    }
    emit();
    return state.joined.includes(activityId);
  }
  function isJoined(activityId) { return state.joined.includes(activityId); }

  function createActivity(data) {
    const a = {
      id: uid("act"),
      title: data.title.trim(),
      interest: data.interest,
      hostId: state.me.id,
      county: data.county,
      location: data.location.trim(),
      when: data.when,
      capacity: Number(data.capacity) || 20,
      priceLRD: Number(data.priceLRD) || 0,
      desc: data.desc.trim(),
      attendees: [state.me.id],
      promoted: !!data.promoted,
      createdAt: now(),
    };
    state.activities.unshift(a);
    state.joined.push(a.id);
    emit();
    return a;
  }

  function myHostedActivities() {
    if (!state.me) return [];
    return state.activities.filter((a) => a.hostId === state.me.id).sort((a, b) => a.when - b.when);
  }
  function myJoinedActivities() {
    return state.joined.map(activityById).filter(Boolean).sort((a, b) => a.when - b.when);
  }

  /* ---------- Messaging ---------- */
  const AUTO_REPLIES = [
    "Hey! Great to connect 🙌", "That sounds good, count me in!",
    "Yes o! When and where?", "Nice, let's link up this week.",
    "For real? I've been wanting to try that.", "Cool cool, I'll bring a friend too.",
    "Bless! See you there.", "Ha, love the energy 😄 let's do it.",
  ];
  function thread(personId) { return state.threads[personId] || []; }
  function sendMessage(personId, text) {
    if (!text.trim()) return;
    if (!state.threads[personId]) state.threads[personId] = [];
    state.threads[personId].push({ from: "me", text: text.trim(), at: now() });
    emit();
    // simulate a reply after a short delay
    setTimeout(() => {
      const reply = AUTO_REPLIES[Math.floor(Math.random() * AUTO_REPLIES.length)];
      state.threads[personId].push({ from: "them", text: reply, at: now() });
      emit();
    }, 1100 + Math.random() * 900);
  }
  function conversations() {
    return Object.keys(state.threads)
      .map((pid) => {
        const t = state.threads[pid];
        const last = t[t.length - 1];
        return { personId: pid, last, count: t.length };
      })
      .sort((a, b) => (b.last ? b.last.at : 0) - (a.last ? a.last.at : 0));
  }

  function upgradeToPlus() {
    if (state.me) { state.me.plus = true; emit(); }
  }

  function setTheme(t) { state.theme = t; document.documentElement.setAttribute("data-theme", t); emit(); }

  function resetAll() {
    localStorage.removeItem(KEY);
    state = DEFAULT_STATE();
    emit();
  }

  // apply theme immediately
  document.documentElement.setAttribute("data-theme", state.theme || "light");

  window.Store = {
    subscribe, get, me, personById, interestById, activityById,
    matchScore, sharedInterests, suggestedPeople, upcomingActivities, activityRelevance,
    completeOnboarding, updateProfile, toggleConnection, isConnected,
    toggleJoin, isJoined, createActivity, myHostedActivities, myJoinedActivities,
    thread, sendMessage, conversations, upgradeToPlus, setTheme, resetAll,
    uid, pickColor,
  };
})();

</script>
<script>
/* ============================================================
   Find My Buddy — App (router + views)
   ============================================================ */
(function () {
  const S = window.Store;
  const D = window.FMB_DATA;
  const app = document.getElementById("app");

  /* ---------------- Helpers ---------------- */
  const h = (html) => html; // tag for readability
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function initials(name) {
    const parts = String(name).trim().split(/\s+/);
    return ((parts[0]?.[0] || "") + (parts[1]?.[0] || "")).toUpperCase() || "?";
  }
  function avatar(person, size = 40, square = false) {
    return `<div class="avatar av-${size} ${square ? "sq" : ""}" style="background:${person.avatarColor || "#4f46e5"}">${esc(initials(person.name))}</div>`;
  }
  function money(lrd) { return lrd === 0 ? "Free" : "L$" + Number(lrd).toLocaleString(); }
  function interestPill(id, opts = {}) {
    const it = S.interestById(id); if (!it) return "";
    return `<span class="chip tiny ${opts.on ? "on" : ""}">${it.emoji} ${esc(it.label)}</span>`;
  }
  function fmtWhen(ts) {
    const d = new Date(ts);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dd = new Date(ts); dd.setHours(0, 0, 0, 0);
    const diff = Math.round((dd - today) / 86400000);
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    let day;
    if (diff === 0) day = "Today";
    else if (diff === 1) day = "Tomorrow";
    else if (diff > 1 && diff < 7) day = d.toLocaleDateString([], { weekday: "long" });
    else day = d.toLocaleDateString([], { month: "short", day: "numeric" });
    return `${day} · ${time}`;
  }
  function relTime(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "now";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    return Math.floor(s / 86400) + "d";
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  const modalRoot = document.getElementById("modal-root");
  function openSheet(innerHTML) {
    modalRoot.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${innerHTML}</div></div>`;
    const ov = document.getElementById("ov");
    ov.addEventListener("click", (e) => { if (e.target === ov) closeSheet(); });
    return modalRoot.querySelector(".sheet");
  }
  function closeSheet() { modalRoot.innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modalRoot.innerHTML) closeSheet(); });

  /* ---------------- Router ---------------- */
  const routes = {};
  function route(name, fn) { routes[name] = fn; }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  window.FMB = { go, toast }; // for inline handlers

  function currentRoute() {
    const raw = (location.hash || "#/discover").slice(1);
    const [path, arg] = raw.split("/").filter(Boolean).length ? [raw.replace(/^\//, ""), null] : ["discover", null];
    const parts = raw.replace(/^\//, "").split("/");
    return { name: parts[0] || "discover", arg: parts[1] || null };
  }

  /* ---------------- Shell ---------------- */
  const TABS = [
    { name: "discover",   ic: "🧭", label: "Discover" },
    { name: "activities", ic: "📅", label: "Activities" },
    { name: "create",     ic: "＋", label: "Create", fab: true },
    { name: "messages",   ic: "💬", label: "Chats" },
    { name: "profile",    ic: "👤", label: "Profile" },
  ];
  function tabbar(active) {
    return `<nav class="tabbar">${TABS.map((t) => `
      <button class="tab ${t.name === active ? "active" : ""}" onclick="FMB.go('#/${t.name}')" aria-label="${t.label}">
        ${t.fab ? `<span class="fab-plus">＋</span>` : `<span class="ic">${t.ic}</span><span>${t.label}</span>`}
      </button>`).join("")}</nav>`;
  }
  function header(title, subtitle) {
    return `<header class="app-header">
      <div>
        <h1><span class="logo-dot"></span> ${esc(title)}</h1>
        ${subtitle ? `<div class="subtitle">${esc(subtitle)}</div>` : ""}
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="FMB.toggleTheme()" aria-label="Toggle theme">${S.get().theme === "dark" ? "☀️" : "🌙"}</button>
      </div>
    </header>`;
  }
  function subheader(title, back = "#/discover") {
    return `<div class="subheader"><button class="icon-btn" onclick="FMB.go('${back}')" aria-label="Back">‹</button><h2>${esc(title)}</h2></div>`;
  }

  FMB.toggleTheme = () => { S.setTheme(S.get().theme === "dark" ? "light" : "dark"); render(); };

  /* ================= ONBOARDING ================= */
  const onboard = { step: 0, name: "", county: "Montserrado", interests: [], bio: "" };
  function renderOnboarding() {
    const steps = [stepWelcome, stepProfile, stepInterests, stepBio];
    app.innerHTML = `<div class="onboard">${steps[onboard.step]()}</div>`;
    wireOnboarding();
  }
  function dots() {
    return `<div class="progress-dots">${[0, 1, 2, 3].map((i) => `<i class="${i <= onboard.step ? "on" : ""}"></i>`).join("")}</div>`;
  }
  function stepWelcome() {
    return `
      <div class="onboard-hero" style="margin-top:8vh">
        <div class="onboard-logo">🤝</div>
        <h1>Find My Buddy</h1>
        <p class="lead">Meet people across Liberia who love what you love — and find or create activities to do together.</p>
      </div>
      <div class="mt-24">
        ${[["🧭", "Discover buddies", "Get matched by shared interests & county"],
           ["📅", "Join real activities", "Football, meetups, dinners, dance & more"],
           ["🚀", "Create your own", "Host an event and grow your community"]].map(([e, t, d]) => `
          <div class="card row" style="align-items:flex-start">
            <div class="avatar av-48 sq" style="background:var(--brand-soft);color:var(--brand);font-size:22px">${e}</div>
            <div class="grow"><div class="bold">${t}</div><div class="muted small">${d}</div></div>
          </div>`).join("")}
      </div>
      <div class="grow"></div>
      ${dots()}
      <button class="btn btn-primary btn-block" id="ob-next">Get started</button>`;
  }
  function stepProfile() {
    return `
      <div style="margin-top:2vh">
        <h1 style="font-size:24px">What's your name?</h1>
        <p class="lead">This is how buddies will find you.</p>
      </div>
      <div class="mt-24">
        <div class="field">
          <label>Full name</label>
          <input class="input" id="ob-name" placeholder="e.g. Amadou Kollie" value="${esc(onboard.name)}" autocomplete="name" />
        </div>
        <div class="field">
          <label>Your county</label>
          <select class="input" id="ob-county">
            ${D.COUNTIES.map((c) => `<option ${c === onboard.county ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="grow"></div>
      ${dots()}
      <div class="row">
        <button class="btn btn-ghost" id="ob-back">Back</button>
        <button class="btn btn-primary grow" id="ob-next">Continue</button>
      </div>`;
  }
  function stepInterests() {
    return `
      <div style="margin-top:2vh">
        <h1 style="font-size:24px">Pick your interests</h1>
        <p class="lead">Choose at least 3. We'll match you with buddies and activities.</p>
      </div>
      <div class="chips mt-24" id="ob-interests">
        ${D.INTERESTS.map((it) => `<button type="button" class="chip selectable ${onboard.interests.includes(it.id) ? "on" : ""}" data-id="${it.id}">${it.emoji} ${it.label}</button>`).join("")}
      </div>
      <div class="grow"></div>
      ${dots()}
      <div class="row">
        <button class="btn btn-ghost" id="ob-back">Back</button>
        <button class="btn btn-primary grow" id="ob-next">Continue (<span id="ob-count">${onboard.interests.length}</span>)</button>
      </div>`;
  }
  function stepBio() {
    return `
      <div style="margin-top:2vh">
        <h1 style="font-size:24px">Add a short bio</h1>
        <p class="lead">Tell buddies a little about you. You can change this later.</p>
      </div>
      <div class="mt-24">
        <div class="field">
          <textarea class="input" id="ob-bio" placeholder="e.g. Love football and coding. New to Monrovia, looking to meet people!">${esc(onboard.bio)}</textarea>
        </div>
      </div>
      <div class="grow"></div>
      ${dots()}
      <div class="row">
        <button class="btn btn-ghost" id="ob-back">Back</button>
        <button class="btn btn-primary grow" id="ob-finish">Join Find My Buddy 🎉</button>
      </div>`;
  }
  function wireOnboarding() {
    const next = document.getElementById("ob-next");
    const back = document.getElementById("ob-back");
    const finish = document.getElementById("ob-finish");
    if (back) back.onclick = () => { onboard.step--; renderOnboarding(); };
    if (next) next.onclick = () => {
      if (onboard.step === 1) {
        const name = document.getElementById("ob-name").value.trim();
        onboard.name = name;
        onboard.county = document.getElementById("ob-county").value;
        if (!name) { toast("Please enter your name"); return; }
      }
      if (onboard.step === 2 && onboard.interests.length < 3) { toast("Pick at least 3 interests"); return; }
      onboard.step++; renderOnboarding();
    };
    if (finish) finish.onclick = () => {
      onboard.bio = document.getElementById("ob-bio").value;
      S.completeOnboarding({ name: onboard.name, county: onboard.county, interests: onboard.interests, bio: onboard.bio });
      toast("Welcome to Find My Buddy! 🎉");
      go("#/discover");
    };
    const wrap = document.getElementById("ob-interests");
    if (wrap) wrap.querySelectorAll(".chip").forEach((c) => {
      c.onclick = () => {
        const id = c.dataset.id;
        const i = onboard.interests.indexOf(id);

        <div class="between" style="margin-top:18px"><div class="section-title" style="margin:0">Interests</div><button class="btn btn-ghost btn-sm" onclick="FMB.editProfile()">Edit</button></div>
        <div class="chips mt-8" style="margin-top:10px">${me.interests.map((i) => interestPill(i, { on: true })).join("")}</div>

        ${!me.plus ? plusBanner(true) : `<div class="card row mt-16" style="background:var(--gold-soft)"><div style="font-size:28px">👑</div><div class="grow"><div class="bold">Buddy Plus active</div><div class="muted small">Enjoy unlimited connects & boosted visibility.</div></div></div>`}

        <div class="section-title">Hosting</div>
        ${hosted.length ? hosted.map(activityCard).join("") : `<div class="card muted small center">You're not hosting anything yet. <a href="#" onclick="FMB.go('#/create');return false">Create an activity →</a></div>`}

        <div class="section-title">Going to</div>
        ${joinedActs.length ? joinedActs.map(activityCard).join("") : `<div class="card muted small center">No activities joined yet.</div>`}

        <div class="divider"></div>
        <button class="btn btn-ghost btn-block" onclick="FMB.editProfile()">✏️ Edit profile</button>
        <button class="btn btn-ghost btn-block mt-8" onclick="FMB.confirmReset()" style="color:var(--accent);margin-top:10px">↺ Reset app data</button>
        <p class="center tiny dim mt-16">Find My Buddy · Made for Liberia 🇱🇷</p>
      </div>
      ${tabbar("profile")}`;
  });

  FMB.editProfile = () => {
    const me = S.me();
    const tmp = { interests: [...me.interests] };
    openSheet(`
      <h2 style="font-size:20px;margin-bottom:4px">Edit profile</h2>
      <p class="muted small mb-16">Update your details anytime.</p>
      <div class="field"><label>Full name</label><input class="input" id="e-name" value="${esc(me.name)}" /></div>
      <div class="field"><label>County</label><select class="input" id="e-county">${D.COUNTIES.map((c) => `<option ${c === me.county ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Bio</label><textarea class="input" id="e-bio">${esc(me.bio)}</textarea></div>
      <div class="field"><label>Interests</label><div class="chips" id="e-interests">${D.INTERESTS.map((it) => `<button type="button" class="chip selectable ${tmp.interests.includes(it.id) ? "on" : ""}" data-id="${it.id}">${it.emoji} ${it.label}</button>`).join("")}</div></div>
      <button class="btn btn-primary btn-block" id="e-save">Save changes</button>
    `);
    modalRoot.querySelectorAll("#e-interests .chip").forEach((c) => c.onclick = () => {
      const id = c.dataset.id; const i = tmp.interests.indexOf(id);
      if (i >= 0) tmp.interests.splice(i, 1); else tmp.interests.push(id);
      c.classList.toggle("on");
    });
    document.getElementById("e-save").onclick = () => {
      const name = document.getElementById("e-name").value.trim();
      if (!name) { toast("Name can't be empty"); return; }
      if (tmp.interests.length < 1) { toast("Pick at least one interest"); return; }
      S.updateProfile({ name, county: document.getElementById("e-county").value, bio: document.getElementById("e-bio").value.trim(), interests: tmp.interests });
      closeSheet(); toast("Profile updated ✓"); render();
    };
  };

  FMB.confirmReset = () => {
    openSheet(`
      <h2 style="font-size:20px">Reset app data?</h2>
      <p class="muted mb-16" style="margin:8px 0 18px">This clears your profile, connections and activities on this device. This cannot be undone.</p>
      <button class="btn btn-accent btn-block" id="r-yes">Yes, reset everything</button>
      <button class="btn btn-ghost btn-block mt-8" style="margin-top:10px" onclick="FMB.closeSheet()">Cancel</button>
    `);
    document.getElementById("r-yes").onclick = () => { S.resetAll(); closeSheet(); onboard.step = 0; onboard.interests = []; onboard.name = ""; onboard.bio = ""; go("#/discover"); };
  };
  FMB.closeSheet = closeSheet;

  /* ================= PREMIUM ================= */
  function plusBanner(compact) {
    return `
      <div class="premium-banner" onclick="FMB.openPlus()">
        <h3>👑 Buddy Plus</h3>
        <p>Unlimited connects, see who viewed you, and get boosted in Discover.</p>
        <button class="btn btn-gold btn-sm">Upgrade — L$500/mo</button>
      </div>`;
  }
  FMB.openPlus = () => {
    const me = S.me();
    openSheet(`
      <div class="center" style="padding:6px 0 4px"><div style="font-size:46px">👑</div><h2 style="font-size:24px">Buddy Plus</h2><p class="muted">Get the most out of Find My Buddy</p></div>
      <div class="mt-16">
        ${[["♾️", "Unlimited connections", "Reach out to as many buddies as you like"],
           ["👀", "See who viewed you", "Know who's checking your profile"],
           ["🚀", "Profile boost", "Appear higher in Discover across your county"],
           ["★", "2 free activity promotions", "Fill your events faster every month"],
           ["✔︎", "Verified badge", "Build trust with a verified profile"]].map(([e, t, d]) => `
          <div class="row" style="margin-bottom:14px;align-items:flex-start"><div style="font-size:22px;width:30px">${e}</div><div class="grow"><div class="bold">${t}</div><div class="muted small">${d}</div></div></div>`).join("")}
      </div>
      <div class="card between" style="background:var(--brand-soft);border:none">
        <div><div class="bold" style="font-size:18px">L$500 <span class="muted small">/ month</span></div><div class="tiny muted">Pay with MTN MoMo or Orange Money</div></div>
        <div class="badge-plus">BEST VALUE</div>
      </div>
      <button class="btn btn-gold btn-block mt-8" id="plus-buy" style="margin-top:12px">${me.plus ? "You're a Plus member ✓" : "Start Buddy Plus"}</button>
      <p class="center tiny dim mt-8" style="margin-top:12px">Cancel anytime · Secure Mobile Money checkout</p>
    `);
    const buy = document.getElementById("plus-buy");
    if (me.plus) buy.disabled = true;
    else buy.onclick = () => { S.upgradeToPlus(); closeSheet(); toast("Welcome to Buddy Plus! 👑"); render(); };
  };

  /* ================= Shared bits ================= */
  function emptyState(em, title, sub) {
    return `<div class="empty"><div class="em">${em}</div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div>`;
  }

  /* ---------------- Render loop ---------------- */
  let debounceTimer;
  function debounceRender() { /* live search updates list without full re-render churn */
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 220);
  }

  function render() {
    if (!S.get().onboarded || !S.me()) { renderOnboarding(); return; }
    const { name, arg } = currentRoute();
    // cleanup chat subscription when leaving chat
    if (name !== "chat" && chatUnsub) { chatUnsub(); chatUnsub = null; }
    const fn = routes[name] || routes["discover"];
    try { fn(arg); } catch (e) { console.error(e); routes["discover"](); }
    if (name !== "chat") window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", render);
  render();
})();

</script>
</body>
</html>
